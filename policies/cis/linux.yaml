policy_name: "Linux CIS Baseline"
os: "linux"
version: "1.0"
rules:
  - id: "CIS-1.1.1"
    os: "linux"
    title: "Disable cramfs module"
    type: "kernel_module"
    target: "cramfs"
    expected: "disabled"
    severity: "high"
    category: "kernel"
  
  - id: "CIS-1.1.2"
    os: "linux"
    title: "Ensure sshd service is disabled"
    type: "service_status"
    target: "cron"
    expected: "disabled"
    severity: "medium"
    category: "remote-access"

  - id: "CUSTOM-1"
    title: "Ensure /etc/hostname contains 'kaycee'"
    type: "custom_script"
    os: "linux"
    severity: "low"
    category: "filesystem"
    script_eval: "scripts/custom/hostname_check.sh"
    script_fix: "scripts/custom/hostname_fix.sh"

