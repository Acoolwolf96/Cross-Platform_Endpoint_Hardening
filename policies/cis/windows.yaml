policy_name: "Windows CIS Baseline"
version: "1.0"
os: "windows"

rules:
  - id: "WIN-1"
    title: "Disable Remote Desktop"
    type: "registry_key"
    os: "windows"
    target: "HKLM\\SYSTEM\\CurrentControlSet\\Control\\Terminal Server\\fDenyTSConnections"
    expected: "1"
    severity: "high"
    category: "remote-access"

  - id: "WIN-2"
    title: "Ensure Windows Update service is enabled"
    type: "service_status"
    os: "windows"
    target: "wuauserv"
    expected: "running"
    severity: "medium"
    category: "services"

  - id: "CUSTOM-WIN-1"
    title: "Custom check for password complexity"
    type: "custom_script"
    os: "windows"
    script_eval: "scripts/custom/windows_password_policy_check.ps1"
    script_fix: "scripts/custom/windows_password_policy_fix.ps1"
    severity: "high"
    category: "auth"
